name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # npm run build crea anche le pagine per sezione e lingua (inglese in radice, italiano
      # sotto it/), 404.html, sitemap e robots (scripts/postbuild.mjs). Poi Chromium riempie
      # quelle pagine con il contenuto già disegnato (prerender, per la SEO) e genera il CV
      # in PDF, italiano e inglese, dai dati del curriculum.
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: npm run cv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
